version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  exclusions:
    # Allow unchecked writes to stdout/stderr (fmt.Fprint*), the usual Go idiom.
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
